<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire sur les résistants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="tract" id="ecran"></section>
</main>

<script src="questions.js"></script>
<script>
const ecran = document.getElementById("ecran");
let prenom = "", index = 0, reussites = [];

function dejaParticipe(){
  try { return localStorage.getItem("resistants_prenom"); } catch { return null; }
}
function memoriser(p){
  try { localStorage.setItem("resistants_prenom", p); } catch {}
}

function accueil(){
  const deja = dejaParticipe();
  if (deja) return dejaFait(deja);
  ecran.innerHTML = `
    <h1></h1>
    <p class="gris"></p>
    <p>${QUESTIONS.length} questions. Tu ne peux participer qu’une seule fois.</p>
    <label for="prenom">Ton prénom</label>
    <input id="prenom" maxlength="30" autocomplete="given-name">
    <p class="erreur" id="msg" role="alert"></p>
    <button class="btn" id="go">Commencer</button>`;
  ecran.querySelector("h1").textContent = TITRE;
  ecran.querySelector(".gris").textContent = SOUS_TITRE;
  const champ = document.getElementById("prenom");
  champ.focus();
  champ.addEventListener("keydown", e => { if (e.key === "Enter") demarrer(); });
  document.getElementById("go").onclick = demarrer;
}

async function demarrer(){
  const msg = document.getElementById("msg");
  const saisi = document.getElementById("prenom").value.trim();
  if (saisi.length < 2) { msg.textContent = "Écris ton prénom (2 lettres minimum)."; return; }
  msg.textContent = "";
  try {
    const r = await fetch("/api/check?prenom=" + encodeURIComponent(saisi));
    const d = await r.json();
    if (d.existe) {
      msg.textContent = "Ce prénom a déjà participé. Utilise un autre prénom ou regarde le dashboard.";
      return;
    }
  } catch {
    msg.textContent = "Connexion impossible. Réessaie dans un instant.";
    return;
  }
  prenom = saisi; index = 0; reussites = [];
  question();
}

function dejaFait(p){
  ecran.innerHTML = `
    <h2>Tu as déjà participé</h2>
    <p class="gris"></p>
    <a class="btn" href="dashboard.html">Voir le dashboard</a>`;
  ecran.querySelector(".gris").textContent = "Participation enregistrée pour « " + p + " ».";
}

function question(){
  const q = QUESTIONS[index];
  ecran.innerHTML = `
    <div class="barre"><div style="width:${(index / QUESTIONS.length) * 100}%"></div></div>
    <p class="gris">Question ${index + 1} sur ${QUESTIONS.length}</p>
    <h2></h2>
    <div class="choix"></div>
    <div id="suite"></div>`;
  ecran.querySelector("h2").textContent = q.question;
  const zone = ecran.querySelector(".choix");
  q.reponses.forEach((texte, i) => {
    const b = document.createElement("button");
    b.textContent = texte;
    b.onclick = () => repondre(i, zone);
    zone.appendChild(b);
  });
}

function repondre(i, zone){
  const q = QUESTIONS[index];
  reussites.push(i === q.bonne);
  [...zone.children].forEach((b, n) => {
    b.disabled = true;
    if (n === q.bonne) b.classList.add("bonne");
    else if (n === i) b.classList.add("mauvaise");
  });
  const dernier = index === QUESTIONS.length - 1;
  document.getElementById("suite").innerHTML =
    `<button class="btn" id="next">${dernier ? "Envoyer mes réponses" : "Question suivante"}</button>`;
  const next = document.getElementById("next");
  next.onclick = () => { index++; dernier ? envoyer() : question(); };
  next.focus();
}

async function envoyer(){
  ecran.innerHTML = `<h2>Envoi en cours…</h2>`;
  try {
    const r = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prenom, reussites })
    });
    const d = await r.json();
    if (r.status === 409) return erreurEnvoi(d.erreur, false);
    if (!r.ok) return erreurEnvoi(d.erreur || "Erreur serveur.", true);
    memoriser(prenom);
    fin(d.score, d.total);
  } catch {
    erreurEnvoi("Connexion impossible.", true);
  }
}

function erreurEnvoi(texte, reessayer){
  ecran.innerHTML = `
    <h2>Envoi impossible</h2>
    <p class="erreur"></p>
    ${reessayer ? '<button class="btn" id="retry">Réessayer l’envoi</button>' : '<a class="btn" href="dashboard.html">Voir le dashboard</a>'}`;
  ecran.querySelector(".erreur").textContent = texte;
  if (reessayer) document.getElementById("retry").onclick = envoyer;
}

function fin(score, total){
  ecran.innerHTML = `
    <h2></h2>
    <div class="score">${score} / ${total}</div>
    <p class="gris">Tes réponses sont enregistrées.</p>
    <a class="btn" href="dashboard.html">Voir le dashboard</a>`;
  ecran.querySelector("h2").textContent = "Merci " + prenom;
}

accueil();
</script>
</body>
</html>
